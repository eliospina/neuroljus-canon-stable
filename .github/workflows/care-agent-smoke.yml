name: Care Agent smoke
# Calls the deployed /api/protocol-from-text once a Vercel deployment is live.
# Protected preview deployments answer 401/403 and are skipped; production is public.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment URL to smoke (default: production)"
        required: false
        default: "https://neuroljus.com"
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/protocol-from-text on the deployment
        env:
          BASE: ${{ github.event.inputs.base_url || github.event.deployment_status.environment_url }}
        run: |
          set -uo pipefail
          echo "Deployment: $BASE (${{ github.event.deployment.environment || 'manual' }})"
          URL="$BASE/api/protocol-from-text?lang=en&text=It%20is%208pm%2C%20Mia%20is%20still%20spinning%20in%20the%20living%20room%20and%20the%20lights%20are%20bright.%20We%20need%20to%20start%20the%20bedtime%20routine."
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.json -w "%{http_code}" -m 40 "$URL" || echo 000)
            echo "attempt $attempt → HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "Deployment protection is on for this URL; smoke skipped."; exit 0
            fi
            sleep 15
          done
          [ "$code" = "200" ] || { echo "::error::endpoint did not answer 200"; head -c 600 body.json; exit 1; }
          python3 - <<'PY'
          import json
          j = json.load(open("body.json"))
          print("source:", j.get("source"), "| scenario:", j.get("scenario"), "| confidence:", j.get("confidence"), "| escalate:", j.get("escalate"))
          print("interpretation:", j.get("interpretation"))
          print("steps:", [s["command"] for s in j["plan"]["steps"]])
          print("validation:", j["plan"]["validation"])
          assert j.get("ok") is True
          assert j["plan"]["validation"]["valid"] is True
          assert j["plan"]["adapterPackets"]["ros2"]["protocol_contract"] == "care_command_protocol_v0"
          if j.get("source") != "claude":
              print("::warning::source is", j.get("source"), "- Claude was not reached (notice:", j.get("notice"), ")")
          PY
