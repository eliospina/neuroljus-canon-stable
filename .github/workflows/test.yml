name: Tests
# Unit tests, type check and the voice-line brain evaluation (scripted model, no
# network, no key). The live evaluation against the deployed brain is run by hand:
# npm run line:eval -- --live
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - run: npm run line:eval
